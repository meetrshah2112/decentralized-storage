{% extends "base.html" %}

{% block title %}Register Storage Node{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body">

                <h3 class="mb-4">
                    Register Storage Node
                </h3>

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Register Node

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
